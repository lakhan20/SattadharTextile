# Sattadhar Textile API — Nginx reverse proxy.
#
#   sudo cp deploy/nginx/sattadhar.conf /etc/nginx/sites-available/sattadhar
#   sudo ln -sf /etc/nginx/sites-available/sattadhar /etc/nginx/sites-enabled/sattadhar
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Listens on plain HTTP on the loopback-facing port only. TLS is terminated by
# Cloudflare at the edge and cloudflared hands the request to Nginx locally, so
# there is no certificate here and no need to open 80/443 in the VCN at all.
#
# If you are NOT using Cloudflare Tunnel, see the commented block at the bottom.

upstream sattadhar_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # MAX_UPLOAD_MB is 5; leave headroom for the multipart envelope. Without
    # this Nginx returns its own 413 before multer can produce a JSON error.
    client_max_body_size 6m;

    # PDF and Excel exports over a shop's mobile data can be slow to generate.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    access_log /var/log/nginx/sattadhar.access.log;
    error_log  /var/log/nginx/sattadhar.error.log warn;

    # Already gzipped by the app's compression() middleware; don't do it twice.
    gzip off;

    # Serve product images straight off disk — never wake Node for a JPEG.
    # Must match UPLOAD_DIR in backend/.env.
    location /uploads/ {
        alias /opt/sattadhar/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://sattadhar_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_buffering off; # keeps PDF streaming responsive
    }

    # Cheap uptime probe that never touches the database or the logs.
    location = /health {
        proxy_pass http://sattadhar_api;
        access_log off;
    }
}

# ── No domain / no Cloudflare Tunnel? ─────────────────────────────────────
# Swap the server block above for this, then run certbot. Requires opening
# TCP 80 and 443 in BOTH the VCN security list AND the instance's iptables
# (deploy/bootstrap.sh has an open_port helper — see docs/DEPLOYMENT.md E2).
#
#   server_name <your-public-ip>.nip.io;
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d <your-public-ip>.nip.io
#
# nip.io resolves <anything>.<ip>.nip.io to that IP, which is enough for
# Let's Encrypt's HTTP-01 challenge — so you get real HTTPS with no domain
# purchase. The catch: the hostname contains the IP, so if the instance ever
# gets a new public IP, every installed APK points at a dead address.
